name: Calendarios personales

# Calendarios personales (Osasuna en El Sadar y Txorigorri F7). Independientes del de
# FCN Bar Orreaga: solo tocan docs/osasuna.ics y docs/txorigorri.ics. Comparte grupo de
# concurrencia con "actualizar" para que no hagan push ni desplieguen Pages a la vez.
on:
  schedule:
    # Todos los días a las 09:23 (hora de Pamplona en invierno). Sin cambios, no hace commit ni despliega.
    - cron: "23 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  personales:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Si una fuente falla, la otra se actualiza igualmente.
      - name: Descargar calendario de Osasuna
        continue-on-error: true
        run: python scripts/osasuna.py

      - name: Descargar calendario de Txorigorri
        continue-on-error: true
        run: python scripts/txorigorri.py

      - name: Guardar cambios
        id: guardar
        run: |
          git config user.name "orreaga-bot"
          git config user.email "orreaga-bot@users.noreply.github.com"
          git add docs/osasuna.ics docs/txorigorri.ics
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar calendarios personales"
            git pull --rebase origin main
            git push
            echo "cambios=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5
        if: steps.guardar.outputs.cambios == '1'
      - uses: actions/upload-pages-artifact@v3
        if: steps.guardar.outputs.cambios == '1'
        with:
          path: docs
      - id: deploy
        if: steps.guardar.outputs.cambios == '1'
        uses: actions/deploy-pages@v4
