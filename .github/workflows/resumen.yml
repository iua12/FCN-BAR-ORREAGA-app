name: Resumen de asistencia

on:
  schedule:
    # Viernes a las 08:00 de Pamplona: 06:00 UTC en horario de verano, 07:00 UTC en invierno.
    # Corren las dos y el primer paso descarta la que no toca.
    - cron: "0 6 * * 5"
    - cron: "0 7 * * 5"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  resumen:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
    steps:
      - name: Comprobar hora de Pamplona
        id: hora
        run: |
          verano=$([ "$(TZ=Europe/Madrid date +%z)" = "+0200" ] && echo si || echo no)
          case "${{ github.event_name }}/${{ github.event.schedule }}/$verano" in
            workflow_dispatch/*|schedule/"0 6 * * 5"/si|schedule/"0 7 * * 5"/no) echo "seguir=si" >> "$GITHUB_OUTPUT" ;;
            *) echo "No es la ejecución de las 08:00 de Pamplona; se omite." ;;
          esac

      - uses: actions/checkout@v4
        if: steps.hora.outputs.seguir == 'si'

      - uses: actions/setup-python@v5
        if: steps.hora.outputs.seguir == 'si'
        with:
          python-version: "3.12"

      - name: Enviar correo
        if: steps.hora.outputs.seguir == 'si'
        run: |
          python scripts/resumen.py --enviar > resumen.txt
          cat resumen.txt >> "$GITHUB_STEP_SUMMARY"
